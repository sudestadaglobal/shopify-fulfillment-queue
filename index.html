<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fulfillment Queue — Sudestada Global</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e5ea;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    header span {
      font-size: 13px;
      color: #86868b;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── Summary cards ─────────────────────────────── */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      border: 1px solid #e5e5ea;
    }

    .card .label {
      font-size: 13px;
      color: #86868b;
      margin-bottom: 8px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card .value {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
    }

    .card.green .value { color: #34c759; }
    .card.red   .value { color: #ff3b30; }
    .card.blue  .value { color: #007aff; }

    .card .sub {
      font-size: 13px;
      color: #86868b;
      margin-top: 8px;
    }

    /* ── Section ───────────────────────────────────── */
    .section {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e5e5ea;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .section-header {
      padding: 18px 24px;
      border-bottom: 1px solid #f2f2f7;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-header h2 {
      font-size: 15px;
      font-weight: 600;
    }

    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .badge-red    { background: #fff1f0; color: #ff3b30; }
    .badge-orange { background: #fff8f0; color: #ff9500; }
    .badge-green  { background: #f0fff4; color: #34c759; }
    .badge-gray   { background: #f2f2f7; color: #86868b; }

    /* ── Table ─────────────────────────────────────── */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      text-align: left;
      padding: 10px 24px;
      font-size: 12px;
      font-weight: 600;
      color: #86868b;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      background: #fafafa;
      border-bottom: 1px solid #f2f2f7;
    }

    td {
      padding: 13px 24px;
      border-bottom: 1px solid #f2f2f7;
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }

    .pill {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .pill-red    { background: #fff1f0; color: #ff3b30; }
    .pill-orange { background: #fff8f0; color: #ff9500; }
    .pill-gray   { background: #f2f2f7; color: #86868b; }

    .empty {
      padding: 32px 24px;
      text-align: center;
      color: #86868b;
      font-size: 14px;
    }

    /* ── Loading / error ───────────────────────────── */
    #loading, #error {
      text-align: center;
      padding: 80px 24px;
      color: #86868b;
      font-size: 15px;
    }

    #error { color: #ff3b30; }

    /* ── Responsive ────────────────────────────────── */
    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; gap: 4px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Fulfillment Queue</h1>
  <span id="last-updated">—</span>
</header>

<main>
  <div id="loading">Loading report…</div>
  <div id="error" style="display:none"></div>
  <div id="content" style="display:none">

    <!-- Summary cards -->
    <div class="cards">
      <div class="card green">
        <div class="label">Ready to Fulfill</div>
        <div class="value" id="cnt-fulfill">—</div>
        <div class="sub">orders tagged RTFF</div>
      </div>
      <div class="card red">
        <div class="label">Blocked</div>
        <div class="value" id="cnt-blocked">—</div>
        <div class="sub">waiting on stock</div>
      </div>
      <div class="card blue">
        <div class="label">Total Unfulfilled</div>
        <div class="value" id="cnt-total">—</div>
        <div class="sub">open orders</div>
      </div>
    </div>

    <!-- Demand exceeds stock -->
    <div class="section">
      <div class="section-header">
        <h2>Demand Exceeds Stock</h2>
        <span class="badge badge-red" id="badge-demand">0</span>
      </div>
      <div id="demand-body"></div>
    </div>

    <!-- Low stock -->
    <div class="section">
      <div class="section-header">
        <h2>Low Stock</h2>
        <span class="badge badge-orange" id="badge-low">0</span>
      </div>
      <div id="low-body"></div>
    </div>

    <!-- Blocked orders detail -->
    <div class="section">
      <div class="section-header">
        <h2>Blocked Orders</h2>
        <span class="badge badge-gray" id="badge-blocked-detail">0</span>
      </div>
      <div id="blocked-body"></div>
    </div>

  </div>
</main>

<script>
  const fmt = new Intl.DateTimeFormat('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
  });

  function fmtDate(iso) {
    return fmt.format(new Date(iso));
  }

  function el(id) { return document.getElementById(id); }

  function stockPill(stock) {
    if (stock === 0) return `<span class="pill pill-red">0 in stock</span>`;
    if (stock < 5)  return `<span class="pill pill-orange">${stock} in stock</span>`;
    return `<span class="pill pill-gray">${stock} in stock</span>`;
  }

  function renderDemandTable(items) {
    if (!items.length) return '<div class="empty">✓ No demand issues</div>';

    return `<table>
      <thead>
        <tr>
          <th>Product</th>
          <th>In Stock</th>
          <th>Total Demand</th>
          <th>Shortfall</th>
        </tr>
      </thead>
      <tbody>
        ${items.map(i => `
          <tr>
            <td>${esc(i.product)}</td>
            <td>${stockPill(i.stock)}</td>
            <td>${i.demand}</td>
            <td><span class="pill pill-red">−${i.shortfall}</span></td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
  }

  function renderLowStockTable(items) {
    if (!items.length) return '<div class="empty">✓ All items sufficiently stocked</div>';

    return `<table>
      <thead>
        <tr>
          <th>Product</th>
          <th>In Stock</th>
          <th>Pending Demand</th>
        </tr>
      </thead>
      <tbody>
        ${items.map(i => `
          <tr>
            <td>${esc(i.product)}</td>
            <td>${stockPill(i.stock)}</td>
            <td>${i.demand}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
  }

  function renderBlockedTable(orders) {
    if (!orders.length) return '<div class="empty">✓ No blocked orders</div>';

    return `<table>
      <thead>
        <tr>
          <th>Order</th>
          <th>Created</th>
          <th>Blocking Reason(s)</th>
        </tr>
      </thead>
      <tbody>
        ${orders.map(o => `
          <tr>
            <td><strong>${esc(o.name)}</strong></td>
            <td>${fmtDate(o.createdAt)}</td>
            <td>${o.reasons.map(r =>
              `<div style="margin-bottom:4px">${esc(r.product)}: <span style="color:#86868b">${esc(r.reason)} (need ${r.needed}, have ${r.stock})</span></div>`
            ).join('')}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
  }

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  async function load() {
    try {
      const res = await fetch('report.json?_=' + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const r = await res.json();

      // Last updated
      el('last-updated').textContent = 'Last run: ' + fmtDate(r.generatedAt);

      // Summary cards
      el('cnt-fulfill').textContent = r.summary.canFulfill;
      el('cnt-blocked').textContent = r.summary.blocked;
      el('cnt-total').textContent   = r.summary.totalUnfulfilled;

      // Demand exceeds stock
      const de = r.stockAlerts?.demandExceedsStock ?? [];
      el('badge-demand').textContent = de.length;
      el('demand-body').innerHTML = renderDemandTable(de);

      // Low stock
      const ls = r.stockAlerts?.lowStock ?? [];
      el('badge-low').textContent = ls.length;
      el('low-body').innerHTML = renderLowStockTable(ls);

      // Blocked orders
      const bo = r.blockedOrders ?? [];
      el('badge-blocked-detail').textContent = bo.length;
      el('blocked-body').innerHTML = renderBlockedTable(bo);

      el('loading').style.display = 'none';
      el('content').style.display = 'block';

    } catch (e) {
      el('loading').style.display = 'none';
      el('error').style.display = 'block';
      el('error').textContent =
        e.message.includes('404') || e.message.includes('Failed to fetch')
          ? 'report.json not found — run the workflow first to generate it.'
          : 'Failed to load report: ' + e.message;
    }
  }

  load();
</script>
</body>
</html>
